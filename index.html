<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Irradiation Creep</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    
    <!-- The script MUST be declared as a module -->
    <script type="module">
      // Import the mount function directly from the CDN
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser/build/stlite.js";
      
      mount({
        requirements: ["numpy", "matplotlib"],
        entrypoint: "app.py",
        files: {
          // This tells Stlite to fetch your separate app.py file from the repository
          "app.py": { url: "./app.py" }
        }
      }, document.getElementById("root"));
    </script>
  </body>
</html>
