<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Irradiation Creep</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.73.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.73.0/build/stlite.js";
      
      mount({
        requirements: ["numpy", "matplotlib"],
        entrypoint: "app.py",
        files: {
          "app.py": { url: "./app.py" },
          "physics.py": { url: "./physics.py" },
          "solver.py": { url: "./solver.py" },
          "beam.py": { url: "./beam.py" },
          "default_config.json": { url: "./default_config.json" }
        }
      }, document.getElementById("root"));
    </script>
  </body>
</html>
